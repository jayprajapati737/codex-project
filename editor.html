<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Clip Editor</title><link rel='stylesheet' href='styles.css'></head><body>
<div id='nav-root'></div>
<main class='container'>
  <h2 class='page-title'>Clip Editor</h2>
  <section class='grid grid-2'>
    <div class='glass card'>
      <h3>Preview</h3>
      <div class='glass' style='aspect-ratio:9/16;display:grid;place-items:center;border-radius:16px'>Vertical Clip Preview</div>
      <div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:12px'>
        <button class='btn'>Trim</button><button class='btn'>Auto Zoom</button><button class='btn'>Caption Style</button><button class='btn'>B-Roll</button>
      </div>
    </div>
    <div class='glass card'>
      <h3>Export & Publish</h3>
      <label>Caption preset</label><select class='select'><option>Bold Viral</option><option>Clean Minimal</option></select>
      <label>Aspect ratio</label><select class='select'><option>9:16</option><option>1:1</option><option>16:9</option></select>
      <label>CTA overlay</label><input class='input' value='Follow for more AI growth tips'>
      <div style='display:flex;gap:10px;flex-wrap:wrap;margin-top:14px'>
        <button class='btn btn-primary'>Download Clip</button><button class='btn'>Post to TikTok</button><button class='btn'>Post to Reels</button>
      </div>
    </div>
  </section>
</main><script src='app.js'></script></body></html>
