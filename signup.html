<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sign up</title><link rel='stylesheet' href='styles.css'></head><body>
<div id='nav-root'></div>
<main class='auth-wrap'>
  <section class='glass card auth-card'>
    <h2>Create account</h2><p class='subtitle'>Start turning long videos into viral clips today.</p>
    <label>Full name</label><input class='input' placeholder='Your name'>
    <label>Email</label><input class='input' type='email' placeholder='you@brand.com'>
    <label>Password</label><input class='input' type='password' placeholder='Create password'>
    <button class='btn btn-primary' style='width:100%;margin-top:14px'>Start Free Trial</button>
    <p class='subtitle'>Already have an account? <a href='login.html' style='color:#38bdf8'>Login</a></p>
  </section>
</main><script src='app.js'></script></body></html>
