<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Upload</title><link rel='stylesheet' href='styles.css'></head><body>
<div id='nav-root'></div>
<main class='container'>
  <h2 class='page-title'>Upload a Long-Form Video</h2>
  <section class='grid grid-2'>
    <div class='glass card'>
      <label>Video file</label><input type='file' class='input'>
      <label>Target platforms</label><select class='select'><option>TikTok + Reels + Shorts</option><option>TikTok only</option><option>Instagram Reels only</option></select>
      <label>Clip length preference</label><select class='select'><option>15-30s</option><option>30-60s</option><option>Mixed</option></select>
      <label>Content niche</label><input class='input' placeholder='e.g., Business, Fitness, Education'>
      <button class='btn btn-primary' style='margin-top:14px'>Start AI Analysis</button>
    </div>
    <div class='glass card'>
      <h3>AI checks include</h3>
      <ul class='subtitle'>
        <li>Speech clarity and impactful lines</li><li>Emotion and tonal shifts</li><li>Pacing and scene transitions</li>
        <li>Caption-worthy soundbites</li><li>Audience hook potential</li><li>Engagement moment scoring</li>
      </ul>
    </div>
  </section>
</main><script src='app.js'></script></body></html>
